name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Unit tests (mocked, no keys needed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -v   # addopts in pytest.ini already excludes -m regression

  regression:
    name: Regression suite (live LLM — only if a key is available)
    runs-on: ubuntu-latest
    needs: test
    if: ${{ !github.event.pull_request.head.repo.fork }}  # secrets aren't exposed to fork PRs
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run regression suite
        run: pytest -v -m regression
        # tests/test_regression.py self-skips (module-level) if no key is
        # configured or data/regression_cases.json hasn't been committed,
        # so this step is a no-op rather than a failure in that case.
